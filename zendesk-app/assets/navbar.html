<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Korva Comply</title>
    <script src="https://static.zdassets.com/zendesk_app_framework_sdk/2.0/zaf_sdk.min.js"></script>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        margin: 16px;
        color: #2f3941;
        font-size: 14px;
        line-height: 1.45;
      }
      p {
        margin: 0 0 14px;
      }
      a.btn {
        display: inline-block;
        background: #03363d;
        color: #fff !important;
        text-decoration: none;
        padding: 10px 18px;
        border-radius: 4px;
        font-weight: 600;
        font-size: 13px;
      }
      a.btn:hover {
        background: #044a54;
      }
    </style>
  </head>
  <body>
    <p id="status">Loading…</p>
    <div id="content" style="display: none">
      <p>
        Korva Comply: compliance workflows and visibility. Use the dashboard
        for setup, SLA views, and operations.
      </p>
      <p>
        <a class="btn" id="open-korva" href="#" target="_blank" rel="noopener"
          >Open dashboard</a
        >
      </p>
    </div>
    <script>
      var client = ZAFClient.init();
      client.on("app.registered", function () {
        client.metadata().then(function (meta) {
          var base =
            (meta && meta.settings && meta.settings.api_url) ||
            "https://comply.korva.io";
          var root = base.replace(/\/$/, "");
          document.getElementById("open-korva").href = root + "/dashboard";
          document.getElementById("status").style.display = "none";
          document.getElementById("content").style.display = "block";
          client.invoke("resize", { width: "420px", height: "200px" });
        });
      });
    </script>
  </body>
</html>
