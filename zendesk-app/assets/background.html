<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Korva Comply — Background</title>
    <script src="https://static.zdassets.com/zendesk_app_framework_sdk/2.0/zaf_sdk.min.js"></script>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        color: #2f3941;
      }
      iframe {
        border: 0;
        width: 100%;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <p id="status" style="padding: 12px">Korva Comply loading…</p>
    <script>
      var client = ZAFClient.init();
      client.metadata().then(function (meta) {
        var base =
          (meta && meta.settings && meta.settings.api_url) ||
          "https://comply.korva.io";
        var url = base.replace(/\/$/, "") + "/dashboard";
        document.body.innerHTML =
          '<iframe title="Korva Comply dashboard" src="' +
          url +
          '"></iframe>';
      });
    </script>
  </body>
</html>
